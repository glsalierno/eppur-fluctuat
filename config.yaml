# eppur-fluctuat — generic protein–ligand screening + small-data QSAR
# Paths are relative to this file unless absolute.

project:
  name: "eppur-fluctuat"
  report_title: "Protein–ligand screening report"

protein:
  pdb_file: "data/protein.pdb"
  chain: "A"
  # Binding site: explicit [x, y, z] in Å, or "auto" (centroid of Cα atoms on `chain`)
  pocket_center: "auto"
  pocket_size: [20, 20, 20]
  # Optional: center box on a co-crystallized ligand (residue name, e.g. donepezil "E20" in some PDBs)
  reference_ligand_resname: null

docking:
  exhaustiveness: 8
  num_modes: 9
  # energy_range: reserved for engines that expose it; Vina Python API docking() uses defaults here.
  energy_range: 3
  # AutoDock Vina (Python API) is CPU-only; this flag is reserved for future GPU backends.
  gpu: true
  seed: 42
  cpu: 0  # 0 = use all available cores

qsar:
  fallback_to_ranking: true
  fallback_loo_r2_threshold: 0.2
  # Logical names; mapped to CSV columns (e.g. binding_energy → binding_energy_kcal_mol)
  use_descriptors:
    - binding_energy
  allow_second_descriptor: false
  second_descriptor_min_n: 10
  min_train_samples: 3
  test_set_compounds: []
  split_covalent_models: false
  covalent_group: []
  test_size: 0

paths:
  ligands: "data/ligands.csv"
  docking_results: "outputs/docking_results.csv"
  computed_features: "outputs/computed_features.csv"
  curated_pIC50: "data/curated_pIC50.csv"
  predictions: "outputs/predictions.csv"
  model_dir: "outputs"
  report_html: "outputs/qsar_report.html"
  plot_scatter: "outputs/model_performance.png"
  plot_importance: "outputs/feature_importance.png"
  plot_be_vs_pic50: "outputs/be_vs_pic50.png"
  loo_table: "outputs/loo_predictions.csv"
  receptor_clean: "outputs/receptor_clean.pdb"
  receptor_pdbqt: "outputs/receptor.pdbqt"
  # Glob (relative to project root) for an example docked ligand in HTML report
  pose_glob: "outputs/docked/*_best.pdbqt"
