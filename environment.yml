# conda env create -f environment.yml && conda activate eppur-fluctuat
name: eppur-fluctuat
channels:
  - conda-forge
dependencies:
  - python=3.11.*
  - pip
  - numpy=1.26.*
  - scipy=1.11.*
  - pandas=2.1.*
  - scikit-learn=1.3.*
  - matplotlib=3.8.*
  - seaborn=0.13.*
  - rdkit=2023.09.*
  - pyyaml=6.0.*
  - biopython=1.83
  - openbabel=3.1.*
  - openmm=8.1.*
  - pip:
      - bigsmiles>=0.0.10,<0.1
      - vina>=1.2.3
      - py3dmol>=2.0.0
      - joblib>=1.3.0
# Optional ALCHEMI v2: pip install -r requirements-alchemi.txt
